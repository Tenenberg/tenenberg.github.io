# One-time (or re-run safe): turns on GitHub Discussions, resolves “General” category id,
# writes it into giscus.ts, and pushes — so the embedded giscus script loads on the site.
#
# Prerequisites:
#   1. Repo secret REPO_ADMIN_PAT — classic PAT with “repo” scope (or fine-grained: Administration + Contents read/write on this repo).
#   2. Install https://github.com/apps/giscus on Tenenberg/tenenberg.github.io (needed for visitors to post).

name: Setup giscus

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        env:
          PAT: ${{ secrets.REPO_ADMIN_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo '::error::Add repository secret REPO_ADMIN_PAT (classic PAT with **repo** scope from https://github.com/settings/tokens ).'
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.REPO_ADMIN_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable GitHub Discussions
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_PAT }}
        run: gh api -X PATCH "/repos/Tenenberg/tenenberg.github.io" -f has_discussions=true

      - name: Resolve General discussion category id
        id: cat
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_PAT }}
        run: |
          CATEGORY_ID=""
          for attempt in $(seq 1 24); do
            RESP=$(curl -sS -H "Authorization: bearer $GH_TOKEN" -H "Content-Type: application/json" \
              -d '{"query":"query { repository(owner: \"Tenenberg\", name: \"tenenberg.github.io\") { discussionCategories(first: 20) { nodes { id name } } } }"}' \
              https://api.github.com/graphql)
            CATEGORY_ID=$(echo "$RESP" | jq -r '.data.repository.discussionCategories.nodes[]? | select(.name=="General") | .id')
            if [ -n "$CATEGORY_ID" ] && [ "$CATEGORY_ID" != "null" ]; then
              echo "Found General on attempt $attempt"
              break
            fi
            echo "attempt $attempt: waiting for Discussion categories…"
            sleep 5
          done
          if [ -z "$CATEGORY_ID" ] || [ "$CATEGORY_ID" = "null" ]; then
            echo '::error::No General category. In the repo on GitHub: Settings → General → Features → enable Discussions, then re-run this workflow.'
            exit 1
          fi
          echo "id=$CATEGORY_ID" >> "$GITHUB_OUTPUT"

      - name: Patch giscus.ts
        run: node scripts/patch-giscus-category.mjs "${{ steps.cat.outputs.id }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/giscus/giscus.ts
          if git diff --staged --quiet; then
            echo "giscus.ts already has this category id — nothing to push."
            exit 0
          fi
          git commit -m "chore: set giscus category id for comments"
          git push
